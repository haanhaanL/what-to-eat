<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>让我想想今天吃什么</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: linear-gradient(145deg, #2b2d42 0%, #1e1f2c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1rem;
        }

        .card {
            background: rgba(22, 23, 35, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            padding: 2.2rem 2rem 2.5rem;
            max-width: 720px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 180, 100, 0.2);
            transition: all 0.2s;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #ffeacb;
            text-shadow: 0 2px 4px rgba(255, 140, 0, 0.4);
            margin-bottom: 1rem;
            word-break: keep-all;
        }

        .title span {
            font-weight: 700;
            color: #ffb347;
            background: linear-gradient(to right, #ffb347, #ffd966);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
        }

        /* ---------- 一级菜单（主分类） ---------- */
        .category-section { margin: 1.2rem 0 0.8rem; }

        .category-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 0.6rem;
        }

        .category-btn {
            border: 1px solid #4a4d6b;
            background: #24263b;
            color: #c8cae0;
            font-weight: 700;
            font-size: 1.15rem;
            padding: 0.9rem 2rem;
            border-radius: 999px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.12s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: none;
            user-select: none;
            flex: 0 1 auto;
            text-transform: uppercase;
        }

        .category-btn:hover {
            background: #2f3147;
            border-color: #ffb347;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: none;
        }

        .category-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        .category-btn.active {
            background: #ffb347;
            color: #1e1f2c;
            border: 1px solid #ffeacb;
            border-bottom: 1px solid #ffeacb;
            box-shadow: none;
            font-weight: 800;
            transform: translateY(0);
            text-shadow: none;
        }

        .category-btn.active:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .category-btn .cat-emoji { font-size: 1.4rem; }

        /* ---------- 二级菜单（子分类） ---------- */
        .category-sub-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.8rem 0 0.2rem;
            padding: 0.4rem 0.2rem;
            border-top: 1px solid rgba(255, 180, 71, 0.15);
        }

        .category-sub-group.hidden-sub { display: none; }

        .sub-label {
            color: #9a9cbb;
            font-size: 0.75rem;
            letter-spacing: 2px;
            margin-right: 0.4rem;
            font-weight: 400;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .sub-btn {
            border: 1px solid #3a3d55;
            background: #1d1f30;
            color: #b0b2cc;
            font-size: 0.8rem;
            padding: 0.35rem 1rem;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.12s;
            letter-spacing: 0.5px;
            font-weight: 500;
            box-shadow: 0 2px 0 #0f1019;
        }

        .sub-btn:hover {
            border-color: #ffb347;
            color: #fff;
            background: #2a2d44;
            transform: translateY(-1px);
        }

        .sub-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0px 0 #0f1019;
        }

        .sub-btn.active {
            background: #ffb347;
            color: #1e1f2c;
            font-weight: 700;
            border-color: #ffeacb;
            box-shadow: 0 3px 0 #9e621b;
            transform: translateY(0);
        }

        .sub-btn.active:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #9e621b;
        }

        .sub-btn.sub-random {
            font-size: 0.9rem;
            padding: 0.35rem 0.7rem;
            min-width: 2.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #2a2d44;
            color: #ffb347;
            border-color: #4a4d6b;
        }

        .sub-btn.sub-random:hover {
            background: #ffb347;
            color: #1e1f2c;
            border-color: #ffeacb;
        }

        /* 食物展示区 */
        .food-box {
            background: #0f1019;
            border-radius: 16px;
            padding: 1rem 1.5rem 1.8rem;
            margin: 1rem 0 1.6rem;
            border: 1px solid #3c3e55;
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.8), 0 2px 0 #4a4d6b;
            transition: all 0.15s ease;
            cursor: pointer;
            user-select: none;
            height: 300px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .food-box:hover {
            border-color: #ffb347;
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 180, 71, 0.3);
        }

        .food-emoji {
            font-size: 3rem;
            line-height: 1.2;
            margin-bottom: 0.3rem;
            filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.6));
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 3.2rem;
            min-height: 3.2rem;
            border-radius: 50%;
            background: rgba(255, 180, 71, 0.12);
            padding: 0.2rem;
            font-weight: 800;
            color: #ffb347;
        }

        .food-emoji.brand-logo {
            border: 1px solid transparent;
            transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.2s;
            font-size: 1.6rem;
        }

        .food-box:hover .food-emoji { transform: scale(1.05); }

        .food-name {
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff4e6;
            text-shadow: 0 4px 0 #7a4f1a, 0 8px 15px rgba(0, 0, 0, 0.6);
            line-height: 1.3;
            word-break: break-word;
            letter-spacing: 1px;
            transition: all 0.2s;
            margin-top: 0.2rem;
        }

        .food-sub-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: 0.35rem;
            min-height: 2.4em;
            justify-content: center;
        }

        .food-sub-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.1;
        }

        .food-sub {
            font-size: 0.9rem;
            color: #b9b9d6;
            letter-spacing: 2px;
            font-weight: 300;
            text-transform: uppercase;
            opacity: 0.8;
            line-height: 1.15;
        }

        .sub-dice {
            border: 1px solid #4a4d6b;
            background: #24263b;
            color: #ffb347;
            font-size: 0.8rem;
            width: 1.6rem;
            height: 1.6rem;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.12s;
            flex-shrink: 0;
            padding: 0;
        }

        .sub-dice:hover {
            background: #ffb347;
            color: #1e1f2c;
            border-color: #ffeacb;
        }

        .category-tag {
            display: inline-block;
            background: #2f3147;
            color: #ffb347;
            font-size: 0.7rem;
            padding: 0.2rem 1rem;
            border-radius: 16px;
            letter-spacing: 2px;
            margin-top: 0.8rem;
            border: 1px solid #4a4d6b;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            margin-top: 0.4rem;
        }

        .btn {
            border: none;
            background: #ffb347;
            color: #1e1f2c;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 0.9rem 2rem;
            border-radius: 999px;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: none;
            transition: all 0.07s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1 1 0;
            min-width: 0;
            border: 1px solid #ffeacb;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn-secondary {
            background: #2f3147;
            color: #ffeacb;
            box-shadow: none;
            border: 1px solid #5b5e7a;
            font-size: 1rem;
            padding: 0.9rem 1.4rem;
            min-width: 0;
            flex: 1 1 0;
        }

        .btn-secondary:active {
            transform: translateY(5px);
            box-shadow: none;
        }

        .btn:disabled,
        .btn-secondary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* 历史记录 */
        .history-area {
            margin-top: 1.8rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.6rem 1rem;
            background: rgba(0, 0, 0, 0.3);
            padding: 0.8rem 1.2rem;
            border-radius: 16px;
            border: 1px solid #36384e;
            color: #b9b9d6;
            font-size: 0.9rem;
        }

        .history-label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffb347;
            font-weight: 500;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .history-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .history-badge {
            background: #24263b;
            padding: 0.25rem 0.9rem;
            border-radius: 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #e0e0f0;
            border: 1px solid #4a4d6b;
            box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.05);
            white-space: nowrap;
            transition: all 0.1s;
            cursor: pointer;
        }

        .history-badge:hover {
            background: #3c3e55;
            border-color: #ffb347;
            color: #fff;
        }

        .empty-history {
            color: #6b6e8a;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .reset-icon { font-size: 1rem; }

        /* 自定义随机面板 */
        .custom-section {
            margin: 1rem 0 1.6rem;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 16px;
            padding: 1rem 1.2rem 1.2rem;
            border: 1px solid #36384e;
            height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .custom-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9a9cbb;
            margin-bottom: 0.7rem;
            text-align: center;
        }

        .custom-input {
            width: 100%;
            background: #0f1019;
            border: 1px solid #4a4d6b;
            border-radius: 999px;
            padding: 0.65rem 1.2rem;
            color: #ffeacb;
            font-size: 0.95rem;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.15s;
            text-align: center;
        }

        .custom-input:focus {
            border-color: #ffb347;
            box-shadow: 0 0 12px rgba(255, 180, 71, 0.3);
        }

        .custom-input::placeholder {
            color: #5a5d7a;
            letter-spacing: 1px;
        }

        .custom-result {
            margin-top: 0.9rem;
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff4e6;
            text-shadow: 0 2px 0 #7a4f1a, 0 4px 10px rgba(0, 0, 0, 0.5);
            min-height: 2.4rem;
            letter-spacing: 1px;
            transition: all 0.15s;
            word-break: break-word;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-result.empty {
            color: #5a5d7a;
            font-weight: 400;
            font-size: 0.85rem;
            font-style: italic;
            text-shadow: none;
        }

        /* 移动端优化 */
        @media (max-width: 560px) {
            .card { padding: 1.6rem 1rem 2rem; }
            .title { font-size: 1.3rem; letter-spacing: 3px; }
            .food-box { padding: 1.5rem 0.8rem; height: 260px; overflow: hidden; }
            .custom-section { height: 260px; }
            .food-name { font-size: 1.9rem; }
            .food-emoji { font-size: 2.4rem; }
            .btn { font-size: 1.05rem; padding: 0.8rem 1.4rem; }
            .btn-secondary { font-size: 0.9rem; padding: 0.8rem 1rem; }
            .history-area { font-size: 0.8rem; padding: 0.6rem 0.8rem; }
            .category-btn { font-size: 1rem; padding: 0.7rem 1.3rem; gap: 6px; }
            .category-btn .cat-emoji { font-size: 1.2rem; }
            .sub-btn { font-size: 0.7rem; padding: 0.25rem 0.8rem; }
            .sub-label { font-size: 0.65rem; letter-spacing: 1px; }
            .custom-result { font-size: 1.2rem; }
            .category-group { gap: 0.6rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="title">今天 <span>吃什么</span> ？</div>

        <div class="category-section">
            <div class="category-group" id="categoryGroup">
                <button class="category-btn active" data-category="main" id="catNoodles">
                    <span class="cat-emoji">🍜</span> 正餐
                </button>
                <button class="category-btn" data-category="sweet" id="catDessert">
                    <span class="cat-emoji">🍰</span> 甜食
                </button>
                <button class="category-btn" data-category="custom" id="catCustom">
                    <span class="cat-emoji">✏️</span> 自定义
                </button>
            </div>

            <div class="category-sub-group" id="subGroup">
                <span class="sub-label" id="subLabel">正餐 ·</span>
            </div>
        </div>

        <div class="food-box" id="foodBox" title="点击也可以随机哦">
            <div class="food-emoji" id="foodEmoji">🍜</div>
            <div class="food-name" id="foodName">豌杂面</div>
            <div class="food-sub-wrap" id="foodSubWrap"></div>
            <div class="category-tag" id="categoryTag">正餐 · 粉面</div>
        </div>

        <div class="custom-section" id="customSection" style="display: none;">
            <div class="custom-label">✏️ 自定义随机（2-5个选项）</div>
            <input
                type="text"
                class="custom-input"
                id="customInput"
                placeholder="输入选项，用逗号或空格分隔，如：火锅,烤肉,麻辣烫"
                autocomplete="off"
            />
            <div class="custom-result empty" id="customResult">输入选项后点随机，这里显示结果</div>
        </div>

        <div class="btn-group">
            <button class="btn" id="randomBtn">随机开饭</button>
            <button class="btn btn-secondary" id="resetHistoryBtn" title="清空历史记录">清空历史</button>
        </div>

        <div class="history-area">
            <div class="history-label">
                <span>📋</span> 随机历史
            </div>
            <div class="history-items" id="historyContainer">
                <span class="empty-history">暂无记录，快选一个吧~</span>
            </div>
        </div>
    </div>

                        { name: '爷爷不泡茶', logo: '爷', color: '#B49265', sub: '推荐：兰香青柠、桂花冰酿、栀子绿茶' },
                        { name: '茉莉奶白', logo: '茉', color: '#FDBBCB', sub: '推荐：茉莉奶白、兰白、栀子奶白' },
                        { name: '奈雪', logo: '奈', color: '#A1DD00', sub: '推荐：霸气橙子、霸气芝士草莓' },
                        { name: '库迪', logo: '库', color: '#B30331', sub: '推荐：生椰拿铁、潘帕斯蓝生酪拿铁' },
                        { name: '一点点', logo: '點', color: '#078062', sub: '推荐：四季奶青、冰淇淋红茶' }

                },
                sweetDessert: {
                    label: '甜品',
                    parent: '甜食',
                    emoji: '🍰',
                    items: [
                        { name: '清补凉', emoji: '🥥', sub: '可选：海南椰奶、广式糖水' },
                        { name: '面包', emoji: '🍞', sub: '可选：吐司、贝果、虎皮卷' },
                        { name: '甜点', emoji: '🍰', sub: '可选：千层蛋糕、华夫饼、舒芙蕾' },
                        { name: '糕点', emoji: '🍪', sub: '品牌：泸溪河、詹记' },
                        { name: '绵绵冰', emoji: '🍧', sub: '口味：芒果、巧克力、抹茶' },
                        { name: '冰淇淋', emoji: '🍦', sub: '品牌：蜜雪冰城、DQ' },
                        { name: '木薯羹', emoji: '🥣', sub: '' },
                        { name: '固体杨枝甘露', emoji: '🥭', sub: '' }
                    ]
                }
            };

            const CATEGORY_GROUPS = {
                main: {
                    label: '正餐',
                    emoji: '🍜',
                    subs: ['noodles', 'rice', 'other', 'stirfry', 'restaurant', 'snacks']
                },
                sweet: {
                    label: '甜食',
                    emoji: '🍰',
                    subs: ['tea', 'sweetDessert']
                }
            };

            const foodBox = document.getElementById('foodBox');
            const foodEmoji = document.getElementById('foodEmoji');
            const foodName = document.getElementById('foodName');
            const foodSubWrap = document.getElementById('foodSubWrap');
            const categoryTag = document.getElementById('categoryTag');
            const randomBtn = document.getElementById('randomBtn');
            const resetHistoryBtn = document.getElementById('resetHistoryBtn');
            const historyContainer = document.getElementById('historyContainer');
            const subGroup = document.getElementById('subGroup');
            const subLabel = document.getElementById('subLabel');
            const customSection = document.getElementById('customSection');

            const catNoodles = document.getElementById('catNoodles');
            const catDessert = document.getElementById('catDessert');
            const catCustom = document.getElementById('catCustom');
            const categoryBtns = document.querySelectorAll('.category-btn');

            const customInput = document.getElementById('customInput');
            const customResult = document.getElementById('customResult');

            let currentCategory = 'noodles';
            let currentTab = 'main';
            let history = [];
            let customHistory = [];   // 自定义随机历史
            const MAX_HISTORY = 5;

            /* 轮播状态 */
            let isRolling = false;
            let rollTimer = null;
            const ROLL_DURATION = 500;   // 0.5秒
            const ROLL_INTERVAL = 60;     // 每60ms切换一次

            /* 自定义滚动状态 */
            let customRollTimer = null;
            let isCustomRolling = false;

            function getCategoryData(key) { return foodCategories[key]; }
            function getCurrentCategoryData() { return foodCategories[currentCategory]; }

            function getRandomFoodFromCategory(key) {
                const catData = foodCategories[key];
                if (!catData || !catData.items.length) return null;
                return catData.items[Math.floor(Math.random() * catData.items.length)];
            }

            function renderSubMenu() {
                subGroup.querySelectorAll('.sub-btn').forEach(el => el.remove());

                if (currentTab === 'custom') {
                    subGroup.classList.add('hidden-sub');
                    subGroup.style.display = 'none';
                    return;
                }

                const group = CATEGORY_GROUPS[currentTab];
                if (!group) {
                    subGroup.classList.add('hidden-sub');
                    subGroup.style.display = 'none';
                    return;
                }

                subGroup.classList.remove('hidden-sub');
                subGroup.style.display = 'flex';
                subLabel.textContent = `${group.label} ·`;

                group.subs.forEach(subKey => {
                    const cat = foodCategories[subKey];
                    if (!cat) return;
                    const btn = document.createElement('button');
                    btn.className = 'sub-btn' + (subKey === currentCategory ? ' active' : '');
                    btn.dataset.sub = subKey;
                    btn.textContent = cat.label;
                    btn.addEventListener('click', () => {
                        if (isRolling) return;
                        if (currentCategory !== subKey) {
                            switchSubCategory(subKey, true);
                        } else {
                            startRollForCurrentCategory();
                        }
                    });
                    subGroup.appendChild(btn);
                });

                const randBtn = document.createElement('button');
                randBtn.className = 'sub-btn sub-random';
                randBtn.id = 'randomSubBtn';
                randBtn.title = '随机选一个二级分类';
                randBtn.textContent = '🎲';
                randBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isRolling) return;
                    pickRandomSubCategory();
                });
                subGroup.appendChild(randBtn);
            }

            function renderSubLines(subText) {
                foodSubWrap.innerHTML = '';
                if (!subText || subText.trim() === '') return;

                const lines = subText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                lines.forEach(line => {
                    const match = line.match(/^(品牌\/可选|品牌|可选|做法|推荐)\s*[:：]\s*(.*)$/);
                    let content = line;
                    if (match) content = match[2].trim();

                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'food-sub-line';

                    const textSpan = document.createElement('span');
                    textSpan.className = 'food-sub';
                    textSpan.textContent = line;
                    lineDiv.appendChild(textSpan);

                    // 判断 content 是否包含多个选项（用逗号、顿号、斜杠、空格等分隔后数量 > 1）
                    const optionList = content
                        .split(/[,，、\/\s]+/)
                        .map(s => s.trim())
                        .filter(s => s.length > 0);

                    // 只有多个选项时才显示骰子
                    if (optionList.length > 1) {
                        const diceBtn = document.createElement('button');
                        diceBtn.className = 'sub-dice';
                        diceBtn.textContent = '🎲';
                        diceBtn.title = '把这行内容带到自定义里随机';
                        diceBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (isRolling) return;
                            if (!content) return;

                            if (currentTab !== 'custom') {
                                currentTab = 'custom';
                                syncMainButtonActive();
                                renderSubMenu();
                                updateSubGroupVisibility();
                            }

                            const existing = parseCustomOptions(customInput.value);
                            if (!existing.includes(content)) {
                                customInput.value = customInput.value.trim()
                                    ? customInput.value.trim() + '，' + content
                                    : content;
                            }
                            customInput.focus();
                            const len = customInput.value.length;
                            customInput.setSelectionRange(len, len);
                        });
                        lineDiv.appendChild(diceBtn);
                    }

                    foodSubWrap.appendChild(lineDiv);
                });
            }

            function applyBrandLogo(food) {
                if (currentCategory === 'tea') {
                    foodEmoji.textContent = food.logo || food.emoji || '';
                    foodEmoji.classList.add('brand-logo');
                    foodEmoji.style.background = food.color || '#ffb347';
                    foodEmoji.style.color = '#ffffff';
                    foodEmoji.style.borderColor = 'transparent';
                } else {
                    foodEmoji.textContent = food.emoji;
                    foodEmoji.classList.remove('brand-logo');
                    foodEmoji.style.background = '';
                    foodEmoji.style.color = '';
                    foodEmoji.style.borderColor = '';
                }
            }

            function updateFoodDisplay(food) {
                if (!food) return;   // 保护
                applyBrandLogo(food);
                foodName.textContent = food.name;
                renderSubLines(food.sub);

                const catData = getCurrentCategoryData();
                if (!catData) return;
                const parentLabel = catData.parent || catData.label;
                if (parentLabel !== catData.label) {
                    categoryTag.textContent = `${catData.emoji} ${parentLabel} · ${catData.label}`;
                } else {
                    categoryTag.textContent = `${catData.emoji} ${catData.label}`;
                }
            }

            /* ---------- 轮播动画 ---------- */
            function startRollAnimation(finalFood, onDone) {
                if (isRolling) return;
                if (!finalFood) return;   // 保护
                isRolling = true;

                // 禁用按钮
                randomBtn.disabled = true;
                resetHistoryBtn.disabled = true;
                foodBox.style.pointerEvents = 'none';
                foodBox.style.cursor = 'default';

                const catData = getCurrentCategoryData();
                const catItems = catData && catData.items ? catData.items : [];
                const startTime = Date.now();

                function tick() {
                    const elapsed = Date.now() - startTime;
                    if (elapsed >= ROLL_DURATION) {
                        // 定格
                        clearInterval(rollTimer);
                        rollTimer = null;
                        updateFoodDisplay(finalFood);
                        addHistory(finalFood.name);
                        isRolling = false;
                        randomBtn.disabled = false;
                        resetHistoryBtn.disabled = false;
                        foodBox.style.pointerEvents = '';
                        foodBox.style.cursor = '';
                        foodBox.style.transform = 'scale(1)';
                        if (typeof onDone === 'function') onDone();
                        return;
                    }

                    if (!catItems.length) return;

                    // 随机切一个显示（尽量不与当前相同）
                    let temp;
                    if (catItems.length > 1) {
                        const currentName = foodName.textContent;
                        do {
                            temp = catItems[Math.floor(Math.random() * catItems.length)];
                        } while (temp && temp.name === currentName && catItems.length > 1);
                    } else {
                        temp = catItems[0];
                    }
                    if (temp) {
                        updateFoodDisplay(temp);
                        // 轻微缩放反馈
                        foodBox.style.transform = 'scale(0.985)';
                        setTimeout(() => { foodBox.style.transform = 'scale(1)'; }, 40);
                    }
                }

                // 立即开始
                tick();
                rollTimer = setInterval(tick, ROLL_INTERVAL);
            }

            /* 当前分类下随机并轮播 */
            function startRollForCurrentCategory() {
                if (currentTab === 'custom' || isRolling) return;
                const catData = getCurrentCategoryData();
                if (!catData || !catData.items || !catData.items.length) return;
                const items = catData.items;

                let finalFood;
                if (items.length <= 1) {
                    finalFood = items[0];
                } else {
                    const currentName = foodName.textContent;
                    do {
                        finalFood = items[Math.floor(Math.random() * items.length)];
                    } while (finalFood && finalFood.name === currentName);
                }
                if (!finalFood) return;
                startRollAnimation(finalFood);
            }

            /* ---------- 食物历史 ---------- */
            function renderHistory() {
                historyContainer.innerHTML = '';

                if (history.length === 0) {
                    const emptySpan = document.createElement('span');
                    emptySpan.className = 'empty-history';
                    emptySpan.textContent = '暂无记录，快选一个吧~';
                    historyContainer.appendChild(emptySpan);
                } else {
                    [...history].reverse().forEach((foodNameStr) => {
                        const badge = document.createElement('span');
                        badge.className = 'history-badge';
                        let foundFood = null;
                        let foundCatKey = null;
                        for (const [catKey, catData] of Object.entries(foodCategories)) {
                            const item = catData.items.find(f => f && f.name === foodNameStr);
                            if (item) {
                                foundFood = item;
                                foundCatKey = catKey;
                                break;
                            }
                        }
                        badge.textContent = foodNameStr;
                        badge.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (isRolling) return;
                            if (foundFood && foundCatKey) {
                                const parentTab = findTabBySub(foundCatKey);
                                if (parentTab) currentTab = parentTab;
                                currentCategory = foundCatKey;
                                syncMainButtonActive();
                                renderSubMenu();
                                updateSubGroupVisibility();
                                applyBrandLogo(foundFood);
                                foodName.textContent = foundFood.name;
                                renderSubLines(foundFood.sub);
                                const catData = foodCategories[foundCatKey];
                                const parentLabel = catData.parent || catData.label;
                                if (parentLabel !== catData.label) {
                                    categoryTag.textContent = `${catData.emoji} ${parentLabel} · ${catData.label}`;
                                } else {
                                    categoryTag.textContent = `${catData.emoji} ${catData.label}`;
                                }
                                foodBox.style.transform = 'scale(0.99)';
                                setTimeout(() => { foodBox.style.transform = 'scale(1)'; }, 80);
                            }
                        });
                        historyContainer.appendChild(badge);
                    });
                }
            }

            function addHistory(foodNameStr) {
                const index = history.indexOf(foodNameStr);
                if (index !== -1) history.splice(index, 1);
                history.push(foodNameStr);
                if (history.length > MAX_HISTORY) history.shift();
                renderHistory();
            }

            /* ---------- 自定义历史 ---------- */
            function renderCustomHistory() {
                historyContainer.innerHTML = '';

                if (customHistory.length === 0) {
                    const emptySpan = document.createElement('span');
                    emptySpan.className = 'empty-history';
                    emptySpan.textContent = '暂无记录，快选一个吧~';
                    historyContainer.appendChild(emptySpan);
                } else {
                    [...customHistory].reverse().forEach((item) => {
                        const badge = document.createElement('span');
                        badge.className = 'history-badge';
                        badge.textContent = item;
                        // 点击回填到输入框
                        badge.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (isCustomRolling) return;
                            customInput.value = item;
                            customInput.focus();
                            const len = customInput.value.length;
                            customInput.setSelectionRange(len, len);
                        });
                        historyContainer.appendChild(badge);
                    });
                }
            }

            function addCustomHistory(item) {
                const index = customHistory.indexOf(item);
                if (index !== -1) customHistory.splice(index, 1);
                customHistory.push(item);
                if (customHistory.length > MAX_HISTORY) customHistory.shift();
                renderCustomHistory();
            }

            function findTabBySub(subKey) {
                for (const [tabKey, group] of Object.entries(CATEGORY_GROUPS)) {
                    if (group.subs.includes(subKey)) return tabKey;
                }
                return null;
            }

            function updateSubGroupVisibility() {
                const isCustom = currentTab === 'custom';
                customSection.style.display = isCustom ? 'flex' : 'none';
                foodBox.style.display = isCustom ? 'none' : 'flex';

                if (isCustom) {
                    randomBtn.innerHTML = '随机选一个';
                    resetHistoryBtn.style.display = 'inline-flex';
                    renderCustomHistory();   // 渲染自定义历史
                } else {
                    randomBtn.innerHTML = '随机开饭';
                    resetHistoryBtn.style.display = 'inline-flex';
                    renderHistory();         // 渲染食物历史
                }
            }

            function syncMainButtonActive() {
                categoryBtns.forEach(btn => {
                    if (btn.dataset.category === currentTab) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            function switchSubCategory(subKey, autoRandom = true) {
                if (isRolling) return;
                if (!foodCategories[subKey]) return;
                currentCategory = subKey;

                const parentTab = findTabBySub(subKey);
                if (parentTab) currentTab = parentTab;

                syncMainButtonActive();
                renderSubMenu();
                updateSubGroupVisibility();

                if (autoRandom) {
                    startRollForCurrentCategory();
                } else {
                    const currentFoodName = foodName.textContent;
                    const catItems = foodCategories[subKey].items;
                    const exists = catItems.some(f => f && f.name === currentFoodName);
                    if (!exists && catItems.length > 0) {
                        const food = catItems[Math.floor(Math.random() * catItems.length)];
                        updateFoodDisplay(food);
                    } else {
                        const catData = foodCategories[subKey];
                        const parentLabel = catData.parent || catData.label;
                        if (parentLabel !== catData.label) {
                            categoryTag.textContent = `${catData.emoji} ${parentLabel} · ${catData.label}`;
                        } else {
                            categoryTag.textContent = `${catData.emoji} ${catData.label}`;
                        }
                    }
                }
            }

            function switchMainTab(tabKey) {
                if (isRolling) return;
                if (tabKey === 'custom') {
                    if (currentTab !== 'custom') {
                        currentTab = 'custom';
                        syncMainButtonActive();
                        renderSubMenu();
                        updateSubGroupVisibility();
                        // 切换进入自定义 tab 时清空输入和结果
                        customInput.value = '';
                        customResult.textContent = '输入选项后点随机，这里显示结果';
                        customResult.classList.add('empty');
                        // 切换 tab 时清空所有随机历史
                        history = [];
                        customHistory = [];
                        renderCustomHistory();
                        customInput.focus();
                    }
                    return;
                }

                // 离开自定义 tab 时清空输入和结果，并停止未完成的滚动
                if (currentTab === 'custom') {
                    customInput.value = '';
                    customResult.textContent = '输入选项后点随机，这里显示结果';
                    customResult.classList.add('empty');
                    if (customRollTimer) {
                        clearInterval(customRollTimer);
                        customRollTimer = null;
                    }
                    isCustomRolling = false;
                    randomBtn.disabled = false;
                    resetHistoryBtn.disabled = false;
                    // 切换 tab 时清空所有随机历史
                    customHistory = [];
                    history = [];
                    renderHistory();
                }

                const group = CATEGORY_GROUPS[tabKey];
                if (!group) return;

                if (currentTab === tabKey) {
                    startRollForCurrentCategory();
                    return;
                }

                // 切换到其他食物 tab 时也清空历史
                history = [];
                customHistory = [];

                const defaultSub = group.subs[0];
                currentTab = tabKey;
                currentCategory = defaultSub;
                syncMainButtonActive();
                renderSubMenu();
                updateSubGroupVisibility();

                startRollForCurrentCategory();
            }

            function pickRandomSubCategory() {
                if (currentTab === 'custom' || isRolling) return;
                const group = CATEGORY_GROUPS[currentTab];
                if (!group || !group.subs.length) return;

                let pool = group.subs.filter(k => k !== currentCategory);
                if (pool.length === 0) pool = group.subs;
                const picked = pool[Math.floor(Math.random() * pool.length)];
                switchSubCategory(picked, true);
            }

            function resetHistory() {
                if (isRolling || isCustomRolling) return;
                if (currentTab === 'custom') {
                    customHistory = [];
                    renderCustomHistory();
                } else {
                    history = [];
                    renderHistory();
                }
                resetHistoryBtn.style.transform = 'scale(0.95)';
                setTimeout(() => { resetHistoryBtn.style.transform = 'scale(1)'; }, 100);
            }

            function parseCustomOptions(str) {
                return str.split(/[,，、\s]+/).map(s => s.trim()).filter(s => s.length > 0);
            }

            function pickCustomRandom() {
                if (isCustomRolling) return;
                const raw = customInput.value.trim();
                if (!raw) {
                    customResult.textContent = '请先输入选项';
                    customResult.classList.add('empty');
                    return;
                }
                const options = parseCustomOptions(raw);
                if (options.length < 2) {
                    customResult.textContent = '至少输入 2 个选项';
                    customResult.classList.add('empty');
                    return;
                }
                if (options.length > 5) {
                    customResult.textContent = '最多支持 5 个选项，请减少一些';
                    customResult.classList.add('empty');
                    return;
                }

                // 滚动动画
                isCustomRolling = true;
                randomBtn.disabled = true;
                resetHistoryBtn.disabled = true;
                customResult.classList.remove('empty');

                const finalPick = options[Math.floor(Math.random() * options.length)];
                const startTime = Date.now();

                function tick() {
                    const elapsed = Date.now() - startTime;
                    if (elapsed >= ROLL_DURATION) {
                        clearInterval(customRollTimer);
                        customRollTimer = null;
                        customResult.textContent = `🎯 ${finalPick}`;
                        customResult.style.transform = 'scale(1.1)';
                        setTimeout(() => { customResult.style.transform = 'scale(1)'; }, 150);
                        addCustomHistory(finalPick);   // 记录到自定义历史
                        isCustomRolling = false;
                        randomBtn.disabled = false;
                        resetHistoryBtn.disabled = false;
                        return;
                    }

                    let temp;
                    if (options.length > 1) {
                        const currentText = customResult.textContent.replace('🎯 ', '');
                        do {
                            temp = options[Math.floor(Math.random() * options.length)];
                        } while (temp === currentText && options.length > 1);
                    } else {
                        temp = options[0];
                    }
                    customResult.textContent = `🎯 ${temp}`;
                    customResult.style.transform = 'scale(0.98)';
                    setTimeout(() => { customResult.style.transform = 'scale(1)'; }, 40);
                }

                tick();
                customRollTimer = setInterval(tick, ROLL_INTERVAL);
            }

            function init() {
                currentTab = 'main';
                currentCategory = 'noodles';

                syncMainButtonActive();
                renderSubMenu();
                updateSubGroupVisibility();

                const defaultFood = foodCategories['noodles'].items[0];
                updateFoodDisplay(defaultFood);
                history = [];
                customHistory = [];
                renderHistory();

                catNoodles.addEventListener('click', () => switchMainTab('main'));
                catDessert.addEventListener('click', () => switchMainTab('sweet'));
                catCustom.addEventListener('click', () => switchMainTab('custom'));

                randomBtn.addEventListener('click', () => {
                    if (isRolling || isCustomRolling) return;
                    if (currentTab === 'custom') {
                        pickCustomRandom();
                    } else {
                        startRollForCurrentCategory();
                    }
                });

                foodBox.addEventListener('click', () => {
                    if (isRolling) return;
                    if (currentTab === 'custom') return;
                    startRollForCurrentCategory();
                });

                resetHistoryBtn.addEventListener('click', resetHistory);

                window.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                    if (currentTab === 'custom' || isRolling) return;
                    if (e.code === 'Space' && !e.repeat) {
                        e.preventDefault();
                        startRollForCurrentCategory();
                    }
                });

                customInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (isCustomRolling) return;
                        pickCustomRandom();
                    }
                });
            }

            init();
        })();
    </script>
</body>
</html>
